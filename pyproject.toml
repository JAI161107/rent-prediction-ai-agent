[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apexrent-ai"
version = "1.0.0"
description = "Autonomous AI Agent & Machine Learning Suite for Residential Rent Valuation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "ApexRent AI Team" }
]
keywords = [
    "real-estate",
    "ai-agent",
    "rent-prediction",
    "machine-learning",
    "fastapi",
    "streamlit",
    "proptech"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
apexrent = "main:main"
